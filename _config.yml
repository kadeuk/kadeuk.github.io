title: Kadeuk Tech Blog
description: 83년생 엔지니어의 M365 정복기
author: Kadeuk
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "default"

# 필수 플러그인
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# 설정 (검색, 한글, 날짜)
search: true
locale: "ko-KR"
timezone: "Asia/Seoul"
future: true

# 레이아웃 자동 적용 (이게 중요!)
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true